<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alimul Fazal Nabil | CV</title>
    <style>
      :root {
        --bg: #040b16;
        --text: #f5f8ff;
        --muted: #9eb0c7;
        --accent: #68e3ff;
        --border: rgba(255, 255, 255, 0.12);
      }
      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, #040b16 0%, #07111f 100%);
        color: var(--text);
      }
      .container { width: min(920px, calc(100% - 2rem)); margin: 0 auto; padding: 3rem 0 4rem; }
      .card { border: 1px solid var(--border); border-radius: 24px; padding: 2rem; background: rgba(255,255,255,0.04); box-shadow: 0 18px 42px rgba(0,0,0,0.18); }
      h1 { margin: 0 0 0.5rem; font-size: clamp(1.7rem, 3vw, 2.4rem); }
      p { color: var(--muted); line-height: 1.7; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 1.2rem; }
      a { color: var(--accent); text-decoration: none; }
      .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.8rem 1rem; border-radius: 999px; border: 1px solid var(--border); }
      .btn.primary { background: linear-gradient(135deg, #3e7cff, #68e3ff); color: #03111f; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>CV / Resume</h1>
        <p>Thank you for your interest in my professional profile. This page is ready for a downloadable CV or a future hosted resume PDF.</p>
        <p>For now, you can reach me directly at <a href="mailto:alimul.nabil@gmail.com">alimul.nabil@gmail.com</a> or visit my <a href="https://www.linkedin.com/in/alimul-fazal-nabil/" target="_blank" rel="noopener noreferrer">LinkedIn</a>.</p>
        <div class="actions">
          <a class="btn primary" href="mailto:alimul.nabil@gmail.com">Request CV</a>
          <a class="btn" href="index.html">Back to Portfolio</a>
        </div>
      </div>
    </div>
  </body>
</html>
